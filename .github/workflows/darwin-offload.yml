# This file was autogenerated by actions.nix. Do not edit it manually.
# To make changes, edit the workflow definition in your flake's actions-nix configuration
# (typically under flake.actions-nix.workflows.".github/workflows/darwin-offload.yml") and run:
#   nix run .#render-workflows
# Or commit to trigger the pre-commit hook if enabled.
jobs:
  build:
    concurrency:
      cancel-in-progress: true
      group: darwin-offload-${{ inputs.target || 'L1' }}
    environment:
      name: dev
    permissions:
      contents: read
    runs-on: ${{ inputs.target == 'ASL1' && 'macos-15' || 'macos-15-intel' }}
    steps:
    - env:
        ARTIFACT_RECIPIENT: ${{ vars.CACHE_ARTIFACT_RECIPIENT }}
      name: Require encrypted transport
      run: test -n "$ARTIFACT_RECIPIENT" || { echo "Set dev variable CACHE_ARTIFACT_RECIPIENT
        to the importer's public age recipient" >&2; exit 1; }
    - name: Checkout repo
      uses: actions/checkout@main
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@master
    - continue-on-error: true
      name: Configure to use personal binary cache @ Cachix
      uses: cachix/cachix-action@master
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: divitmittal
        skipPush: true
    - name: SSH-agent with auth for private repos
      uses: webfactory/ssh-agent@master
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    - name: Point local-checkout inputs at GitHub
      run: |-
        overrides=$(jq -r '
          .nodes as $n | $n.root.inputs | to_entries[]
          | select(.value | type == "string") | .key as $k | $n[.value].locked
          | select(.type == "path" or ((.url // "") | startswith("file:")))
          | ((.path // .url) | sub("/+$"; "") | split("/") | last) as $repo
          | if ($repo | test("secrets"))
            then "--override-input \($k) git+ssh://git@github.com/DivitMittal/\($repo).git"
            else "--override-input \($k) github:DivitMittal/\($repo)"
            end' flake.lock | tr '\n' ' ')
        echo "LOCAL_OVERRIDES=$overrides" >> "$GITHUB_ENV"
        echo "overrides: $overrides"
    - id: darwin_credentials
      name: Check private Darwin cache credentials
      run: echo "enabled=${{ secrets.ATTIC_DARWIN_TOKEN != '' && secrets.TS_OAUTH_CLIENT_ID
        != '' && secrets.TS_OAUTH_SECRET != '' && vars.DARWIN_CACHE_PUBLIC_KEY !=
        '' }}" >> "$GITHUB_OUTPUT"
    - continue-on-error: true
      env:
        TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      id: darwin_tailnet
      if: steps.darwin_credentials.outputs.enabled == 'true'
      name: Join the tailnet for the private Darwin cache
      run: |-
        rev=$(jq -r '.nodes["nixpkgs-2605"].locked.rev' flake.lock)
        nix profile install "github:NixOS/nixpkgs/$rev#tailscale" "github:NixOS/nixpkgs/$rev#attic-client"
        python3 flake/actions/darwin-tailnet.py
      timeout-minutes: 10
    - continue-on-error: true
      env:
        ATTIC_DARWIN_CACHE: darwin
        ATTIC_DARWIN_TOKEN: ${{ secrets.ATTIC_DARWIN_TOKEN }}
        ATTIC_ENDPOINT: http://192.168.2.8:8080
        ATTIC_REMOTE: homelab
        DARWIN_CACHE_PUBLIC_KEY: ${{ vars.DARWIN_CACHE_PUBLIC_KEY }}
      id: darwin_cache
      if: steps.darwin_tailnet.outcome == 'success'
      name: Use only the private pinned Darwin cache
      run: |-
        python3 flake/actions/darwin-cache.py
        attic use homelab:darwin
    - continue-on-error: true
      env:
        ATTIC_DARWIN_CACHE: darwin
        ATTIC_DARWIN_TOKEN: ${{ secrets.ATTIC_DARWIN_TOKEN }}
        ATTIC_ENDPOINT: http://192.168.2.8:8080
        ATTIC_REMOTE: homelab
        DARWIN_CACHE_PUBLIC_KEY: ${{ vars.DARWIN_CACHE_PUBLIC_KEY }}
      id: darwin_probe
      if: steps.darwin_cache.outcome == 'success'
      name: Prove signed private cache push and independent pull
      run: |-
        set -euo pipefail
        printf '%s\n' "darwin-cache-probe $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/darwin-probe.txt"
        probe=$(nix-store --add "$RUNNER_TEMP/darwin-probe.txt")
        attic push --no-closure -j 2 homelab:darwin "$probe"
        python3 flake/actions/darwin-cache.py "$probe"
        nix copy --from http://192.168.2.8:8080/darwin \
          --to "local?root=$RUNNER_TEMP/darwin-probe-store" \
          --option require-sigs true --option trusted-public-keys "$DARWIN_CACHE_PUBLIC_KEY" "$probe"
        cmp "$probe" "$RUNNER_TEMP/darwin-probe-store$probe"
        echo "Private Darwin cache: authenticated push, anonymous narinfo denied, signed independent pull passed" >> "$GITHUB_STEP_SUMMARY"
      shell: bash
    - env:
        CACHE_VERIFIED: ${{ steps.darwin_probe.outcome == 'success' }}
        TARGET: ${{ inputs.target || 'L1' }}
      name: Build on native Darwin
      run: |-
        set -euo pipefail
        # Preserve completed dependencies across cancelled or failed runs.
        # This is enabled only after the private signed-cache probe passes.
        if [ "$CACHE_VERIFIED" = true ]; then
          attic watch-store -j 2 homelab:darwin > "$RUNNER_TEMP/darwin-attic-watch.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/darwin-attic-watch.pid"
        fi
        case "$TARGET" in
          L1) test "$(uname -m)" = x86_64 ;;
          ASL1) test "$(uname -m)" = arm64 ;;
          *) echo "Unsupported target" >&2; exit 1 ;;
        esac
        # macOS's Bash 3.2 treats an empty array as unset under nounset.
        set --
        if [ -n "$LOCAL_OVERRIDES" ]; then
          read -r -a local_overrides <<< "$LOCAL_OVERRIDES"
          set -- "${local_overrides[@]}"
        fi
        nix build --accept-flake-config --no-write-lock-file --max-jobs 2 --cores 2 --option fallback true \
          ".#darwinConfigurations.$TARGET.system" --out-link result-system "$@"
        nix build --accept-flake-config --no-write-lock-file --max-jobs 2 --cores 2 --option fallback true \
          ".#homeConfigurations.$TARGET.activationPackage" --out-link result-home "$@"
        readlink -f result-system > deployment-paths.txt
        readlink -f result-home >> deployment-paths.txt
        printf '%s\n' "$GITHUB_SHA" > source-revision.txt
      shell: bash
    - continue-on-error: true
      env:
        ATTIC_DARWIN_CACHE: darwin
        ATTIC_DARWIN_TOKEN: ${{ secrets.ATTIC_DARWIN_TOKEN }}
        ATTIC_ENDPOINT: http://192.168.2.8:8080
        ATTIC_REMOTE: homelab
        DARWIN_CACHE_PUBLIC_KEY: ${{ vars.DARWIN_CACHE_PUBLIC_KEY }}
      id: darwin_push
      if: steps.darwin_probe.outcome == 'success'
      name: Push both closures to the private Darwin cache
      run: |-
        python3 flake/actions/darwin-cache.py
        attic push -j 2 homelab:darwin ./result-system ./result-home
        nix path-info --store http://192.168.2.8:8080/darwin \
          "$(readlink -f ./result-system)" "$(readlink -f ./result-home)"
        echo "Both Darwin closures are present in the private signed cache" >> "$GITHUB_STEP_SUMMARY"
    - if: steps.darwin_push.outcome == 'success'
      name: Upload cached deployment paths and provenance
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: darwin-${{ inputs.target || 'L1' }}-${{ github.sha }}
        path: |-
          deployment-paths.txt
          source-revision.txt
        retention-days: 30
    - env:
        ARTIFACT_RECIPIENT: ${{ vars.CACHE_ARTIFACT_RECIPIENT }}
      if: steps.darwin_push.outcome != 'success'
      name: Encrypt both deployment closures
      run: |-
        set -euo pipefail
        rev=$(jq -r '.nodes["nixpkgs-2605"].locked.rev' flake.lock)
        # Expansion in the nested bash process is intentional.
        # shellcheck disable=SC2016
        nix shell "github:NixOS/nixpkgs/$rev#age" "github:NixOS/nixpkgs/$rev#zstd" --command bash -euo pipefail -c '
          nix-store --query --requisites ./result-system ./result-home \
            | sort -u | nix-store --export --stdin | zstd -T2 -3 \
            | age -r "$ARTIFACT_RECIPIENT" -o deployment.nar.zst.age
        '
      shell: bash
    - continue-on-error: true
      if: always() && steps.darwin_credentials.outputs.enabled == 'true'
      name: Disconnect the ephemeral Darwin runner
      run: |-
        if [ -f "$RUNNER_TEMP/darwin-attic-watch.pid" ]; then
          pid=$(cat "$RUNNER_TEMP/darwin-attic-watch.pid")
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
          else
            echo "::warning::The incremental cache uploader stopped before job cleanup"
          fi
        fi
        if command -v tailscale >/dev/null; then
          sudo -n tailscale --socket="$RUNNER_TEMP/darwin-tailscaled.sock" logout
        fi
    - if: steps.darwin_push.outcome != 'success'
      name: Upload encrypted closures and provenance
      uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        if-no-files-found: error
        name: darwin-${{ inputs.target || 'L1' }}-${{ github.sha }}
        path: |-
          deployment.nar.zst.age
          deployment-paths.txt
          source-revision.txt
        retention-days: 3
    timeout-minutes: 360
'on':
  push:
    branches:
    - master
    paths:
    - flake.nix
    - flake.lock
    - flake/**
    - common/**
    - home/**
    - hosts/darwin/**
    - modules/**
    - overlays/**
    - pkgs/**
  workflow_dispatch:
    inputs:
      target:
        default: L1
        description: Native Darwin target (build only)
        options:
        - L1
        - ASL1
        required: true
        type: choice
