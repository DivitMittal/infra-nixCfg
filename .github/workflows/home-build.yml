# To make changes, edit the workflow definition in your flake's actions-nix configuration
# (typically under flake.actions-nix.workflows.".github/workflows/home-build.yml") and run:
#   nix run .#render-workflows
# Or commit to trigger the pre-commit hook if enabled.
jobs:
  build-home-manager-and-graph:
    environment:
      name: dev
    permissions:
      contents: write
      id-token: write
    runs-on: macos-15-intel
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
      with:
        fetch-depth: 1
        persist-credentials: true
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@master
    - name: Magic Nix Cache(Use Github Actions Cache)
      uses: DeterminateSystems/magic-nix-cache-action@main
    - continue-on-error: true
      name: Configure to use personal binary cache @ Cachix
      uses: cachix/cachix-action@master
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: divitmittal
    - name: SSH-agent with auth for private repos
      uses: webfactory/ssh-agent@master
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    - id: attic
      name: Check for attic credentials
      run: echo "enabled=${{ secrets.ATTIC_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
    - continue-on-error: true
      if: steps.attic.outputs.enabled == 'true'
      name: Join the tailnet to reach attic on T1
      uses: tailscale/github-action@v3
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci
    - continue-on-error: true
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      if: steps.attic.outputs.enabled == 'true'
      name: Use the attic cache on T1
      run: |-
        nix profile install "github:NixOS/nixpkgs/$(jq -r '.nodes["nixpkgs-2605"].locked.rev' flake.lock)#attic-client"
        attic login t1 http://t1:8080 "$ATTIC_TOKEN"
        attic use t1:infra
    - name: Point local-checkout inputs at GitHub
      run: |-
        overrides=$(jq -r '
          .nodes as $n | $n.root.inputs | to_entries[]
          | select(.value | type == "string") | .key as $k | $n[.value].locked
          | select(.type == "path" or ((.url // "") | startswith("file:")))
          | ((.path // .url) | sub("/+$"; "") | split("/") | last) as $repo
          | if ($repo | test("secrets"))
            then "--override-input \($k) git+ssh://git@github.com/DivitMittal/\($repo).git"
            else "--override-input \($k) github:DivitMittal/\($repo)"
            end' flake.lock | tr '\n' ' ')
        echo "LOCAL_OVERRIDES=$overrides" >> "$GITHUB_ENV"
        echo "overrides: $overrides"
    - name: Builds a home-manager configuration
      run: nix build --accept-flake-config .#homeConfigurations.L1.activationPackage
        --show-trace $LOCAL_OVERRIDES
    - continue-on-error: true
      if: steps.attic.outputs.enabled == 'true'
      name: Push the result to the attic cache on T1
      run: attic push t1:infra ./result
    - name: Generate home-manager dependency graph
      run: nix -vL run github:craigmbooth/nix-visualize -- --verbose --output ./assets/home_graph.png
        ./result
    - name: Invert graph colors
      run: nix run nixpkgs#imagemagick -- convert ./assets/home_graph.png -channel
        RGB -negate +channel ./assets/home_graph.png
    - env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      name: Push to repo
      run: |-
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email bot@github.com
        git add .
        git commit -m "chore: update home-manager dependency graph" || echo "No changes to commit"
        git pull --rebase origin master
        git push origin master
    timeout-minutes: 150
'on':
  push:
    tags:
    - home*
