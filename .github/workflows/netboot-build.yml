# To make changes, edit the workflow definition in your flake's actions-nix configuration
# (typically under flake.actions-nix.workflows.".github/workflows/netboot-build.yml") and run:
#   nix run .#render-workflows
# Or commit to trigger the pre-commit hook if enabled.
jobs:
  build-netboot-bundle:
    environment:
      name: dev
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@master
    - name: Magic Nix Cache(Use Github Actions Cache)
      uses: DeterminateSystems/magic-nix-cache-action@main
    - continue-on-error: true
      name: Configure to use personal binary cache @ Cachix
      uses: cachix/cachix-action@master
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: divitmittal
        skipPush: true
    - name: SSH-agent with auth for private repos
      uses: webfactory/ssh-agent@master
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    - id: attic
      name: Check for attic credentials
      run: echo "enabled=${{ secrets.ATTIC_TOKEN != '' && secrets.TS_OAUTH_CLIENT_ID
        != '' && secrets.TS_OAUTH_SECRET != '' }}" >> "$GITHUB_OUTPUT"
    - continue-on-error: true
      id: tailnet
      if: steps.attic.outputs.enabled == 'true'
      name: Join the tailnet to reach attic on T3
      uses: tailscale/github-action@v3
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci
    - continue-on-error: true
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      id: attic_setup
      if: steps.tailnet.outcome == 'success'
      name: Use the attic cache on T3
      run: |-
        nix profile install "github:NixOS/nixpkgs/$(jq -r '.nodes["nixpkgs-2605"].locked.rev' flake.lock)#attic-client"
        if [ "$RUNNER_OS" = Linux ]; then
          sudo tailscale set --accept-routes=true --accept-dns=false
        fi
        # Keep the JWT out of process arguments and the Nix store.
        install -d -m 700 "$HOME/.config/attic"
        umask 077
        python3 - <<'PYCONFIG'
        import json, os
        from pathlib import Path
        config = Path.home() / ".config/attic/config.toml"
        config.write_text('[servers.homelab]\nendpoint = "http://192.168.2.8:8080/"\ntoken = ' + json.dumps(os.environ["ATTIC_TOKEN"]) + '\n')
        config.chmod(0o600)
        PYCONFIG
        attic use homelab:infra
    - name: Point local-checkout inputs at GitHub
      run: |-
        overrides=$(jq -r '
          .nodes as $n | $n.root.inputs | to_entries[]
          | select(.value | type == "string") | .key as $k | $n[.value].locked
          | select(.type == "path" or ((.url // "") | startswith("file:")))
          | ((.path // .url) | sub("/+$"; "") | split("/") | last) as $repo
          | if ($repo | test("secrets"))
            then "--override-input \($k) git+ssh://git@github.com/DivitMittal/\($repo).git"
            else "--override-input \($k) github:DivitMittal/\($repo)"
            end' flake.lock | tr '\n' ' ')
        echo "LOCAL_OVERRIDES=$overrides" >> "$GITHUB_ENV"
        echo "overrides: $overrides"
    - name: Build netboot bundle
      run: |-
        nix -vL build --accept-flake-config .#netboot-bundle --show-trace -o result $LOCAL_OVERRIDES
        # upload-artifact doesn't follow a symlinked store directory
        cp -rL result t1-netboot-bundle
        ls -lh t1-netboot-bundle
    - name: Upload bundle
      uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        name: t1-netboot-bundle
        path: t1-netboot-bundle
        retention-days: 14
    timeout-minutes: 90
'on':
  push:
    paths:
    - flake/netboot.nix
    - .github/workflows/netboot-build.yml
    - hosts/netboot/**
    - common/hosts/netboot/**
  workflow_dispatch: {}
